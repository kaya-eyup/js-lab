//                              destructuring uygulama


const kullanici = { ad: "Ayşe", yas: 22, adres: { sehir: "İzmir" } };

const { ad, yas } = kullanici;
console.log(ad, yas);


const { ad: isim } = kullanici;  // "nesnedeki ad anahtarının değerini al, adı isim olan yeni bir değişkene koy." Ortaya çıkan değişken isim'dir, ad değil.
console.log(isim);
      
const { meslek = "belirsiz" } = kullanici;   // meslek varsa valuesini, yoksa default olarak belirsiz değerini döndürür.
console.log(meslek);


const { adres: { sehir } } = kullanici;      //  İzmir
console.log(sehir);



//const { iletisim: {email } } = kullanici?.iletisim?.email;   // ? ← burada dur, düşün. // olmayan key için default atama yapılmamış hata vermeli.
